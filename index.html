<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>I Love You 💙</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #102241;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* =========================
           START SCREEN
        ========================= */

        #startScreen {
            position: fixed;
            inset: 0;

            z-index: 20;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle at center,
                    #1C4562 0%,
                    #102241 50%,
                    #08162c 100%
                );

            cursor: pointer;

            transition:
                opacity 0.7s ease,
                visibility 0.7s ease;
        }

        #startScreen.hide {
            opacity: 0;
            visibility: hidden;
        }

        .start-content {
            text-align: center;
            color: #BDEDFB;
            user-select: none;
        }

        .heart-icon {
            font-size: 54px;
            margin-bottom: 15px;

            animation:
                pulseHeart
                1.5s
                ease-in-out
                infinite;

            filter:
                drop-shadow(
                    0 0 15px #94D8F4
                );
        }

        .start-text {
            font-family:
                Arial,
                sans-serif;

            font-size: 14px;
            letter-spacing: 4px;

            text-transform: uppercase;

            text-shadow:
                0 0 10px #94D8F4,
                0 0 20px #5399CD;
        }

        @keyframes pulseHeart {
            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }
        }
    </style>
</head>


<body>


    <!-- =========================
         START
    ========================== -->

    <div id="startScreen">

        <div class="start-content">

            <div class="heart-icon">
                💙
            </div>

            <div class="start-text">
                Click to start
            </div>

        </div>

    </div>


    <!-- =========================
         CANVAS
    ========================== -->

    <canvas id="canvas"></canvas>


    <!-- =========================
         AUDIO
    ========================== -->

    <audio
        id="music"
        preload="auto"
    >

        <source
            src="WhatsApp Audio 2026-10-01 at 01.11.17.mpeg"
            type="audio/mpeg"
        >

    </audio>


<script>


/*
==================================================
ELEMENTS
==================================================
*/

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const music =
    document.getElementById("music");

const startScreen =
    document.getElementById("startScreen");


/*
==================================================
REFERENCE SIZE
==================================================
*/

const BASE_WIDTH = 1900;

const BASE_HEIGHT = 1000;

const BASE_SCALE = 24;

const BASE_Y_OFFSET = 60;


/*
==================================================
TIMELINE
==================================================

0  -  8 sec
Outline terbentuk.

8  - 35 sec
Isi hati terus bertambah.

35 - 38 sec
Tulisan besar muncul.

==================================================
*/

const OUTLINE_START = 0;

const OUTLINE_END = 8;


const FILL_START = 8;

const FILL_END = 35;


const CENTER_START = 35;

const CENTER_END = 38;


/*
==================================================
COLORS
==================================================
*/

const BACKGROUND_COLOR =
    "#102241";


const COLORS = [

    "#5399CD",

    "#BDEDFB",

    "#94D8F4",

    "#86C3EB",

    "#244C7E",

    "#2D5D9A",

    "#1E7AC1",

    "#143C8C",

    "#1C4562"

];


/*
==================================================
WORDS
==================================================
*/


/*
Outline jangan diubah.

Ini yang menjaga bentuk hati.
*/

const OUTLINE_WORDS = [

    "I Love You"

];


/*
Kata-kata di bagian dalam hati.
*/

const FILL_WORDS = [

    "proud of you",

    "believe in you",

    "keep going, love",

    "take care of yourself",

    "lucky to have you",

    "you're doing enough",

    "i'm here always"

];


/*
Tulisan ending.
*/

const CENTER_TEXT =
    "I Love You";


/*
==================================================
CANVAS VARIABLES
==================================================
*/

let width = 0;

let height = 0;


let displayScale = 1;

let heartScale =
    BASE_SCALE;

let yOffset =
    BASE_Y_OFFSET;


let centerX = 0;

let centerY = 0;


let outlineParticles = [];

let fillParticles = [];

let particles = [];


let started =
    false;


/*
==================================================
HELPERS
==================================================
*/

function randomFloat(
    min,
    max
) {

    return (

        Math.random()

        *

        (
            max - min
        )

        +

        min

    );

}


function randomChoice(array) {

    return array[

        Math.floor(

            Math.random()

            *
            array.length

        )

    ];

}


function clamp(
    value,
    min,
    max
) {

    return Math.max(

        min,

        Math.min(
            value,
            max
        )

    );

}


function distance(
    x1,
    y1,
    x2,
    y2
) {

    return Math.hypot(

        x1 - x2,

        y1 - y2

    );

}


/*
==================================================
PARTICLE CLASS
==================================================
*/

class Particle {

    constructor(
        x,
        y,
        order,
        kind
    ) {

        this.x =
            x;

        this.y =
            y;


        this.order =
            order;

        this.kind =
            kind;


        /*
        Outline = I Love You.

        Fill = kalimat random.
        */

        if (
            kind === "outline"
        ) {

            this.word =
                randomChoice(
                    OUTLINE_WORDS
                );

        }

        else {

            this.word =
                randomChoice(
                    FILL_WORDS
                );

        }


        this.color =
            randomChoice(
                COLORS
            );


        /*
        Setiap tulisan punya
        flicker yang tidak sama.
        */

        this.flicker =
            randomFloat(
                0,
                Math.PI * 2
            );


        /*
        Variasi ukuran sedikit.
        */

        this.sizeMult =
            randomFloat(
                0.85,
                1.15
            );


        /*
        Kapan tulisan muncul.
        */

        this.revealTime =
            0;

    }

}


/*
==================================================
HEART FORMULA
==================================================
*/

function heartXY(t) {

    const x =

        16

        *

        Math.pow(
            Math.sin(t),
            3
        );


    const y =

        13
        *
        Math.cos(t)

        -

        5
        *
        Math.cos(
            2 * t
        )

        -

        2
        *
        Math.cos(
            3 * t
        )

        -

        Math.cos(
            4 * t
        );


    return {

        x: x,

        y: -y

    };

}


/*
==================================================
CONVERT TO SCREEN POSITION
==================================================
*/

function toScreen(
    x,
    y
) {

    return {

        x:

            x
            *
            heartScale

            +

            centerX,


        y:

            y
            *
            heartScale

            +

            centerY

            +

            yOffset

    };

}


/*
==================================================
BUILD OUTLINE
==================================================
*/

function buildOutlineParticles(
    nOutline = 160,
    minGap = 34
) {

    const result =
        [];

    const placed =
        [];


    const scaledGap =

        minGap

        *
        displayScale;


    for (
        let i = 0;

        i < nOutline;

        i++
    ) {

        const t =

            (
                i
                /
                nOutline
            )

            *

            Math.PI
            *
            2;


        const heart =
            heartXY(t);


        const screen =
            toScreen(
                heart.x,
                heart.y
            );


        let tooClose =
            false;


        for (
            const point
            of placed
        ) {

            if (

                distance(

                    screen.x,
                    screen.y,

                    point.x,
                    point.y

                )

                <
                scaledGap

            ) {

                tooClose =
                    true;

                break;

            }

        }


        if (
            tooClose
        ) {

            continue;

        }


        placed.push({

            x: screen.x,

            y: screen.y

        });


        result.push(

            new Particle(

                screen.x,

                screen.y,

                i,

                "outline"

            )

        );

    }


    return result;

}


/*
==================================================
BUILD FILL
==================================================

Lebih banyak particle daripada versi awal.

Tujuannya supaya bagian tengah
terus bertambah sampai mendekati
detik ke-35.

==================================================
*/

function buildFillParticles(
    nFill = 220,
    minGap = 34
) {

    const result =
        [];

    const placed =
        [];


    let attempts =
        0;


    const maxAttempts =

        nFill

        *
        120;


    const scaledGap =

        minGap

        *
        displayScale;


    while (

        result.length
        <
        nFill

        &&

        attempts
        <
        maxAttempts

    ) {

        attempts++;


        /*
        Random posisi
        di dalam bentuk hati.
        */

        const t =

            randomFloat(

                0,

                Math.PI
                *
                2

            );


        /*
        0.90 supaya bagian isi
        sedikit lebih mendekati outline.
        */

        const r =

            randomFloat(

                0.02,

                0.90

            );


        const heart =
            heartXY(t);


        const px =

            heart.x

            *
            r;


        const py =

            heart.y

            *
            r;


        const screen =
            toScreen(
                px,
                py
            );


        let tooClose =
            false;


        for (
            const point
            of placed
        ) {

            if (

                distance(

                    screen.x,
                    screen.y,

                    point.x,
                    point.y

                )

                <
                scaledGap

            ) {

                tooClose =
                    true;

                break;

            }

        }


        if (
            tooClose
        ) {

            continue;

        }


        placed.push({

            x: screen.x,

            y: screen.y

        });


        result.push(

            new Particle(

                screen.x,

                screen.y,

                result.length,

                "fill"

            )

        );

    }


    return result;

}


/*
==================================================
SHUFFLE
==================================================
*/

function shuffle(array) {

    for (

        let i =
            array.length - 1;

        i > 0;

        i--

    ) {

        const j =

            Math.floor(

                Math.random()

                *
                (
                    i + 1
                )

            );


        [
            array[i],
            array[j]

        ]

        =

        [
            array[j],
            array[i]
        ];

    }

}


/*
==================================================
SET REVEAL TIMES
==================================================
*/

function setRevealTimes() {


    /*
    ==============================================
    OUTLINE

    Dibuat teratur mengikuti garis hati.
    ==============================================
    */

    const outlineDuration =

        OUTLINE_END

        -

        OUTLINE_START;


    outlineParticles.forEach(

        (
            particle,
            index
        ) => {

            const progress =

                index

                /

                Math.max(

                    1,

                    outlineParticles.length
                    -
                    1

                );


            particle.revealTime =

                OUTLINE_START

                +

                progress

                *
                outlineDuration;

        }

    );


    /*
    ==============================================
    FILL

    Urutannya diacak,
    lalu dibentangkan sepanjang 27 detik.

    Jadi akan terus muncul
    satu demi satu sampai detik 35.
    ==============================================
    */

    shuffle(
        fillParticles
    );


    const fillDuration =

        FILL_END

        -

        FILL_START;


    fillParticles.forEach(

        (
            particle,
            index
        ) => {

            const progress =

                index

                /

                Math.max(

                    1,

                    fillParticles.length
                    -
                    1

                );


            /*
            Sedikit jitter supaya
            tidak terasa terlalu matematis.
            */

            const jitter =

                randomFloat(
                    -0.06,
                    0.06
                );


            particle.revealTime =

                FILL_START

                +

                progress

                *
                fillDuration

                +

                jitter;

        }

    );

}


/*
==================================================
CREATE PARTICLES
==================================================
*/

function createParticles() {

    outlineParticles =

        buildOutlineParticles(

            160,

            34

        );


    fillParticles =

        buildFillParticles(

            220,

            34

        );


    setRevealTimes();


    particles = [

        ...outlineParticles,

        ...fillParticles

    ];

}


/*
==================================================
DRAW GLOW TEXT
==================================================
*/

function drawGlowText(
    particle,
    alpha
) {

    if (
        alpha <= 0
    ) {

        return;

    }


    /*
    Outline sedikit lebih besar.

    Fill lebih kecil karena
    kalimatnya lebih panjang.
    */

    const baseSize =

        particle.kind
        ===
        "outline"

        ?

        20

        :

        13.5;


    const fontSize =

        Math.max(

            5,

            baseSize

            *
            displayScale

            *
            particle.sizeMult

        );


    ctx.save();


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.font =

        `bold ${fontSize}px Arial`;


    /*
    ==============================================
    BIG GLOW
    ==============================================
    */

    if (
        alpha > 10
    ) {

        ctx.save();


        ctx.translate(

            particle.x,

            particle.y

        );


        ctx.scale(
            2.2,
            2.2
        );


        ctx.globalAlpha =

            (
                alpha / 255
            )

            /
            10;


        ctx.fillStyle =
            particle.color;


        ctx.fillText(

            particle.word,

            0,

            0

        );


        ctx.restore();


        /*
        ==========================================
        MEDIUM GLOW
        ==========================================
        */

        ctx.save();


        ctx.translate(

            particle.x,

            particle.y

        );


        ctx.scale(
            1.45,
            1.45
        );


        ctx.globalAlpha =

            (
                alpha / 255
            )

            /
            4;


        ctx.fillStyle =
            particle.color;


        ctx.fillText(

            particle.word,

            0,

            0

        );


        ctx.restore();

    }


    /*
    ==============================================
    MAIN TEXT
    ==============================================
    */

    ctx.globalAlpha =

        alpha

        /
        255;


    ctx.fillStyle =
        particle.color;


    ctx.shadowColor =
        particle.color;


    ctx.shadowBlur =

        Math.max(

            4,

            7
            *
            displayScale

        );


    ctx.fillText(

        particle.word,

        particle.x,

        particle.y

    );


    ctx.restore();

}


/*
==================================================
DRAW PARTICLES
==================================================
*/

function drawParticles(
    currentTime
) {

    for (
        const particle
        of particles
    ) {

        /*
        Belum waktunya muncul.
        */

        if (

            currentTime

            <
            particle.revealTime

        ) {

            continue;

        }


        /*
        Fade-in cepat.

        Kurang lebih mirip
        alpha increment source Python.
        */

        const fadeDuration =
            0.28;


        const fadeProgress =

            clamp(

                (
                    currentTime

                    -
                    particle.revealTime
                )

                /

                fadeDuration,

                0,

                1

            );


        let alpha =

            fadeProgress

            *
            255;


        /*
        Setelah muncul penuh,
        flicker lembut.

        Posisi tidak bergerak.
        */

        if (
            fadeProgress >= 1
        ) {

            const flick =

                0.75

                +

                0.25

                *
                Math.sin(

                    currentTime

                    *
                    2.4

                    +

                    particle.flicker

                );


            alpha *=
                flick;

        }


        drawGlowText(

            particle,

            alpha

        );

    }

}


/*
==================================================
CENTER TEXT
==================================================

Baru muncul 3 detik terakhir.

==================================================
*/

function drawCenterText(
    currentTime
) {

    if (

        currentTime

        <
        CENTER_START

    ) {

        return;

    }


    const progress =

        clamp(

            (
                currentTime

                -
                CENTER_START
            )

            /

            (
                CENTER_END

                -
                CENTER_START
            ),

            0,

            1

        );


    /*
    Fade masuk.
    */

    const fade =

        1

        -

        Math.exp(

            -
            progress

            *
            9

        );


    /*
    Scale dari sedikit kecil
    ke ukuran normal.
    */

    const scaleIn =

        0.86

        +

        0.14

        *
        fade;


    /*
    Pulse kecil seperti source awal.
    */

    const pulse =

        1

        +

        0.025

        *
        Math.sin(

            currentTime

            *
            4

        );


    const finalScale =

        scaleIn

        *
        pulse;


    const fontSize =

        Math.max(

            24,

            64

            *
            displayScale

        );


    ctx.save();


    ctx.translate(

        centerX,

        centerY

    );


    ctx.scale(

        finalScale,

        finalScale

    );


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.font =

        `bold ${fontSize}px Georgia`;


    /*
    Glow besar.
    */

    ctx.globalAlpha =

        fade

        *
        0.18;


    ctx.fillStyle =
        "#94D8F4";


    ctx.shadowColor =
        "#94D8F4";


    ctx.shadowBlur =

        42

        *
        displayScale;


    ctx.fillText(

        CENTER_TEXT,

        0,

        0

    );


    /*
    Tulisan utama.
    */

    ctx.globalAlpha =
        fade;


    ctx.fillStyle =
        "#BDEDFB";


    ctx.shadowColor =
        "#94D8F4";


    ctx.shadowBlur =

        18

        *
        displayScale;


    ctx.fillText(

        CENTER_TEXT,

        0,

        0

    );


    ctx.restore();

}


/*
==================================================
BACKGROUND
==================================================
*/

function drawBackground() {

    ctx.fillStyle =
        BACKGROUND_COLOR;


    ctx.fillRect(

        0,

        0,

        width,

        height

    );

}


/*
==================================================
ANIMATION
==================================================
*/

function animate() {

    requestAnimationFrame(
        animate
    );


    drawBackground();


    if (
        !started
    ) {

        return;

    }


    /*
    Kita tetap baca currentTime audio
    cuma supaya durasinya sinkron.

    TAPI:
    tidak ada beat tracking.
    tidak ada glow sesuai beat.
    tidak ada motion sesuai lagu.
    */

    const currentTime =

        music.currentTime;


    drawParticles(
        currentTime
    );


    drawCenterText(
        currentTime
    );

}


/*
==================================================
START EXPERIENCE
==================================================
*/

async function startExperience() {

    if (
        started
    ) {

        return;

    }


    music.currentTime =
        0;


    music.volume =
        0.65;


    try {

        await music.play();


        /*
        Baru dianggap mulai
        setelah audio berhasil play.
        */

        started =
            true;


        startScreen.classList.add(
            "hide"
        );

    }

    catch(error) {

        console.log(
            "Audio error:",
            error
        );

    }

}


/*
==================================================
CLICK TO START
==================================================
*/

startScreen.addEventListener(

    "pointerdown",

    startExperience

);


/*
==================================================
RESIZE
==================================================
*/

function resizeCanvas() {

    const dpr =

        window.devicePixelRatio

        ||

        1;


    width =
        window.innerWidth;


    height =
        window.innerHeight;


    canvas.width =

        width

        *
        dpr;


    canvas.height =

        height

        *
        dpr;


    canvas.style.width =

        width

        +
        "px";


    canvas.style.height =

        height

        +
        "px";


    ctx.setTransform(

        dpr,

        0,

        0,

        dpr,

        0,

        0

    );


    displayScale =

        Math.min(

            width
            /
            BASE_WIDTH,

            height
            /
            BASE_HEIGHT

        );


    /*
    Mobile.
    */

    if (
        width < 700
    ) {

        displayScale *=
            1.55;

    }


    heartScale =

        BASE_SCALE

        *
        displayScale;


    yOffset =

        BASE_Y_OFFSET

        *
        displayScale;


    centerX =
        width / 2;


    centerY =
        height / 2;


    /*
    Build ulang posisi particle.
    */

    createParticles();

}


/*
==================================================
AUDIO FINISHED
==================================================
*/

music.addEventListener(

    "ended",

    function() {

        /*
        Tidak restart.

        Tampilan terakhir tetap ada.
        */

    }

);


/*
==================================================
INITIALIZE
==================================================
*/

window.addEventListener(

    "resize",

    resizeCanvas

);


resizeCanvas();


requestAnimationFrame(
    animate
);


</script>

</body>

</html>
