<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>I Love You 💙</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #102241;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ==============================
           START SCREEN
        ============================== */

        #startScreen {
            position: fixed;
            inset: 0;

            z-index: 20;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #102241;

            cursor: pointer;

            transition:
                opacity 0.6s ease,
                visibility 0.6s ease;
        }

        #startScreen.hide {
            opacity: 0;
            visibility: hidden;
        }

        .start-content {
            text-align: center;
            color: #BDEDFB;
            user-select: none;
        }

        .start-heart {
            font-size: 52px;
            margin-bottom: 15px;

            filter:
                drop-shadow(
                    0 0 15px #94D8F4
                );

            animation:
                startPulse
                1.5s
                ease-in-out
                infinite;
        }

        .start-text {
            font-family: Arial, sans-serif;

            font-size: 14px;

            letter-spacing: 4px;

            text-transform: uppercase;

            text-shadow:
                0 0 10px #94D8F4,
                0 0 20px #5399CD;
        }

        @keyframes startPulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

        }
    </style>
</head>


<body>


    <!-- ==============================
         START SCREEN
    ============================== -->

    <div id="startScreen">

        <div class="start-content">

            <div class="start-heart">
                💙
            </div>

            <div class="start-text">
                Click to start
            </div>

        </div>

    </div>


    <!-- ==============================
         CANVAS
    ============================== -->

    <canvas id="canvas"></canvas>


    <!-- ==============================
         AUDIO
    ============================== -->

    <audio
        id="music"
        preload="auto"
    >

        <source
            src="WhatsApp Audio 2026-10-01 at 01.11.17.mpeg"
            type="audio/mpeg"
        >

    </audio>


<script>


/*
==========================================================
ELEMENTS
==========================================================
*/

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const music =
    document.getElementById("music");

const startScreen =
    document.getElementById("startScreen");


/*
==========================================================
REFERENCE SIZE
==========================================================
*/

const BASE_WIDTH =
    1900;

const BASE_HEIGHT =
    1000;

const BASE_SCALE =
    24;

const BASE_Y_OFFSET =
    60;


/*
==========================================================
TIMELINE
==========================================================
*/

const SONG_DURATION =
    38.06;


/*
0–8 detik:
outline
*/

const OUTLINE_START =
    0;

const OUTLINE_END =
    8;


/*
8–35 detik:
fill
*/

const FILL_START =
    8;

const FILL_END =
    35;


/*
35–38 detik:
center text
*/

const CENTER_START =
    35;

const CENTER_END =
    38.06;


/*
==========================================================
COLORS
==========================================================
*/

const BACKGROUND_COLOR =
    "#102241";


const COLORS = [

    "#5399CD",

    "#BDEDFB",

    "#94D8F4",

    "#86C3EB",

    "#244C7E",

    "#2D5D9A",

    "#1E7AC1",

    "#143C8C",

    "#1C4562"

];


/*
==========================================================
WORDS
==========================================================
*/


/*
Outline tetap satu kata
supaya bentuk hati rapi.
*/

const OUTLINE_WORDS = [

    "I Love You"

];


/*
Bagian dalam hati.
*/

const FILL_WORDS = [

    "proud of you",

    "believe in you",

    "keep going, love",

    "take care of yourself",

    "lucky to have you",

    "you're doing enough",

    "i'm here always"

];


/*
Tulisan besar ending.
*/

const CENTER_TEXT =
    "I Love You";


/*
==========================================================
VARIABLES
==========================================================
*/

let width =
    0;

let height =
    0;


let displayScale =
    1;

let heartScale =
    BASE_SCALE;

let yOffset =
    BASE_Y_OFFSET;


let centerX =
    0;

let centerY =
    0;


let outlineParticles =
    [];

let fillParticles =
    [];

let particles =
    [];


let started =
    false;


/*
==========================================================
HELPERS
==========================================================
*/

function randomFloat(
    min,
    max
) {

    return (

        Math.random()

        *

        (
            max - min
        )

        +

        min

    );

}


function randomChoice(
    array
) {

    return array[

        Math.floor(

            Math.random()

            *
            array.length

        )

    ];

}


function clamp(
    value,
    min,
    max
) {

    return Math.max(

        min,

        Math.min(
            value,
            max
        )

    );

}


function distance(
    x1,
    y1,
    x2,
    y2
) {

    return Math.hypot(

        x1 - x2,

        y1 - y2

    );

}


/*
==========================================================
PARTICLE
==========================================================
*/

class Particle {

    constructor(
        x,
        y,
        order,
        kind
    ) {

        this.x =
            x;

        this.y =
            y;


        this.order =
            order;

        this.kind =
            kind;


        /*
        Teks berdasarkan jenis.
        */

        if (
            kind === "outline"
        ) {

            this.word =
                randomChoice(
                    OUTLINE_WORDS
                );

        }

        else {

            this.word =
                randomChoice(
                    FILL_WORDS
                );

        }


        /*
        Random color.
        */

        this.color =
            randomChoice(
                COLORS
            );


        /*
        Flicker phase berbeda.
        */

        this.flicker =

            randomFloat(

                0,

                Math.PI * 2

            );


        /*
        Sedikit variasi ukuran.
        */

        this.sizeMult =

            randomFloat(

                0.85,

                1.15

            );


        /*
        Waktu muncul.
        */

        this.revealTime =
            0;

    }

}


/*
==========================================================
HEART FORMULA
==========================================================
*/

function heartXY(t) {

    const x =

        16

        *

        Math.pow(

            Math.sin(t),

            3

        );


    const y =

        13
        *
        Math.cos(t)

        -

        5
        *
        Math.cos(
            2 * t
        )

        -

        2
        *
        Math.cos(
            3 * t
        )

        -

        Math.cos(
            4 * t
        );


    return {

        x: x,

        y: -y

    };

}


/*
==========================================================
SCREEN POSITION
==========================================================
*/

function toScreen(
    x,
    y
) {

    return {

        x:

            x
            *
            heartScale

            +

            centerX,


        y:

            y
            *
            heartScale

            +

            centerY

            +

            yOffset

    };

}


/*
==========================================================
BUILD OUTLINE
==========================================================
*/

function buildOutlineParticles(
    nOutline = 160,
    minGap = 34
) {

    const result =
        [];

    const placed =
        [];


    const scaledGap =

        minGap

        *
        displayScale;


    for (
        let i = 0;

        i < nOutline;

        i++
    ) {

        const t =

            (
                i
                /
                nOutline
            )

            *
            Math.PI
            *
            2;


        const heart =
            heartXY(t);


        const screen =
            toScreen(

                heart.x,

                heart.y

            );


        let tooClose =
            false;


        for (
            const point
            of placed
        ) {

            if (

                distance(

                    screen.x,

                    screen.y,

                    point.x,

                    point.y

                )

                <
                scaledGap

            ) {

                tooClose =
                    true;

                break;

            }

        }


        if (
            tooClose
        ) {

            continue;

        }


        placed.push({

            x:
                screen.x,

            y:
                screen.y

        });


        result.push(

            new Particle(

                screen.x,

                screen.y,

                i,

                "outline"

            )

        );

    }


    return result;

}


/*
==========================================================
BUILD FILL
==========================================================

Lebih padat supaya cukup
mengisi durasi sampai detik 35.

==========================================================
*/

function buildFillParticles(
    nFill = 210,
    minGap = 31
) {

    const result =
        [];

    const placed =
        [];


    let attempts =
        0;


    const maxAttempts =

        nFill

        *
        150;


    const scaledGap =

        minGap

        *
        displayScale;


    while (

        result.length
        <
        nFill

        &&

        attempts
        <
        maxAttempts

    ) {

        attempts++;


        /*
        Posisi random di dalam heart.
        */

        const t =

            randomFloat(

                0,

                Math.PI
                *
                2

            );


        const r =

            randomFloat(

                0,

                0.88

            );


        const heart =
            heartXY(t);


        const px =

            heart.x

            *
            r;


        const py =

            heart.y

            *
            r;


        const screen =
            toScreen(
                px,
                py
            );


        let tooClose =
            false;


        for (
            const point
            of placed
        ) {

            if (

                distance(

                    screen.x,

                    screen.y,

                    point.x,

                    point.y

                )

                <
                scaledGap

            ) {

                tooClose =
                    true;

                break;

            }

        }


        if (
            tooClose
        ) {

            continue;

        }


        placed.push({

            x:
                screen.x,

            y:
                screen.y

        });


        result.push(

            new Particle(

                screen.x,

                screen.y,

                result.length,

                "fill"

            )

        );

    }


    return result;

}


/*
==========================================================
SHUFFLE
==========================================================
*/

function shuffle(
    array
) {

    for (

        let i =
            array.length - 1;

        i > 0;

        i--

    ) {

        const j =

            Math.floor(

                Math.random()

                *
                (
                    i + 1
                )

            );


        [
            array[i],
            array[j]

        ]

        =

        [
            array[j],
            array[i]
        ];

    }

}


/*
==========================================================
SET TIMING
==========================================================
*/

function setRevealTimes() {


    /*
    ======================================================
    OUTLINE
    ======================================================

    Berurutan membentuk hati.
    */

    outlineParticles.forEach(

        (
            particle,
            index
        ) => {

            const progress =

                index

                /

                Math.max(

                    1,

                    outlineParticles.length
                    -
                    1

                );


            particle.revealTime =

                OUTLINE_START

                +

                progress

                *
                (
                    OUTLINE_END

                    -
                    OUTLINE_START
                );

        }

    );


    /*
    ======================================================
    FILL
    ======================================================

    Random seperti motion original.
    */

    shuffle(
        fillParticles
    );


    fillParticles.forEach(

        (
            particle,
            index
        ) => {

            const progress =

                index

                /

                Math.max(

                    1,

                    fillParticles.length
                    -
                    1

                );


            /*
            Random sedikit.
            */

            const jitter =

                randomFloat(

                    -0.10,

                    0.10

                );


            particle.revealTime =

                FILL_START

                +

                progress

                *
                (
                    FILL_END

                    -
                    FILL_START
                )

                +

                jitter;

        }

    );

}


/*
==========================================================
CREATE PARTICLES
==========================================================
*/

function createParticles() {

    outlineParticles =

        buildOutlineParticles(

            160,

            34

        );


    fillParticles =

        buildFillParticles(

            210,

            31

        );


    setRevealTimes();


    particles = [

        ...outlineParticles,

        ...fillParticles

    ];

}


/*
==========================================================
DRAW PARTICLE TEXT
==========================================================

CATATAN:

Glow utama tetap permanen.

Yang fade out cuma:

- layer 2.4x
- layer 1.6x

alias halo / shadow tipis
di belakang tulisan.

==========================================================
*/

function drawGlowText(
    particle,
    alpha,
    shadowStrength
) {

    if (
        alpha <= 0
    ) {

        return;

    }


    /*
    Font outline dan fill.
    */

    const baseSize =

        particle.kind
        ===
        "outline"

        ?

        20

        :

        14.5;


    const fontSize =

        Math.max(

            5,

            baseSize

            *
            displayScale

            *
            particle.sizeMult

        );


    ctx.save();


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.font =

        `bold ${fontSize}px Arial`;


    /*
    ======================================================
    SHADOW / HALO BESAR

    Fade out setelah tulisan muncul.
    ======================================================
    */

    if (

        alpha > 10

        &&

        shadowStrength > 0

    ) {

        ctx.save();


        ctx.translate(

            particle.x,

            particle.y

        );


        ctx.scale(

            2.4,

            2.4

        );


        ctx.globalAlpha =

            (
                alpha
                /
                255
            )

            /
            7

            *

            shadowStrength;


        ctx.fillStyle =
            particle.color;


        ctx.fillText(

            particle.word,

            0,

            0

        );


        ctx.restore();


        /*
        ==================================================
        SHADOW / HALO KECIL
        ==================================================
        */

        ctx.save();


        ctx.translate(

            particle.x,

            particle.y

        );


        ctx.scale(

            1.6,

            1.6

        );


        ctx.globalAlpha =

            (
                alpha
                /
                255
            )

            /
            3

            *

            shadowStrength;


        ctx.fillStyle =
            particle.color;


        ctx.fillText(

            particle.word,

            0,

            0

        );


        ctx.restore();

    }


    /*
    ======================================================
    TEXT UTAMA

    Glow ini tetap permanen.
    ======================================================
    */

    ctx.globalAlpha =

        alpha

        /
        255;


    ctx.fillStyle =
        particle.color;


    ctx.shadowColor =
        particle.color;


    /*
    GLOW UTAMA TETAP.
    */

    ctx.shadowBlur =

        Math.max(

            4,

            7

            *
            displayScale

        );


    ctx.fillText(

        particle.word,

        particle.x,

        particle.y

    );


    ctx.restore();

}


/*
==========================================================
DRAW PARTICLES
==========================================================
*/

function drawParticles(
    currentTime
) {

    for (
        const particle
        of particles
    ) {

        /*
        Belum muncul.
        */

        if (

            currentTime

            <
            particle.revealTime

        ) {

            continue;

        }


        /*
        ==================================================
        FADE-IN TEKS
        ==================================================
        */

        const fadeDuration =
            0.28;


        const fadeProgress =

            clamp(

                (
                    currentTime

                    -
                    particle.revealTime
                )

                /

                fadeDuration,

                0,

                1

            );


        let alpha =

            fadeProgress

            *
            255;


        /*
        ==================================================
        FLICKER

        Tetap seperti source awal.
        ==================================================
        */

        if (
            fadeProgress >= 1
        ) {

            const flick =

                0.75

                +

                0.25

                *
                Math.sin(

                    currentTime

                    *
                    2.4

                    +

                    particle.flicker

                );


            alpha *=
                flick;

        }


        /*
        ==================================================
        SHADOW FADE OUT

        Shadow besar hanya muncul
        selama ±1 detik pertama.

        Glow utama tidak ikut hilang.
        ==================================================
        */

        const age =

            currentTime

            -

            particle.revealTime;


        const shadowDuration =
            1.0;


        const shadowStrength =

            clamp(

                1

                -

                age
                /
                shadowDuration,

                0,

                1

            );


        drawGlowText(

            particle,

            alpha,

            shadowStrength

        );

    }

}


/*
==========================================================
CENTER TEXT
==========================================================

Muncul pada 3 detik terakhir.

Shadow besar fade out.

Glow utama tetap.

==========================================================
*/

function drawCenterText(
    currentTime
) {

    if (

        currentTime

        <
        CENTER_START

    ) {

        return;

    }


    /*
    Progress 35–38.
    */

    const progress =

        clamp(

            (
                currentTime

                -
                CENTER_START
            )

            /

            (
                CENTER_END

                -
                CENTER_START
            ),

            0,

            1

        );


    /*
    Fade teks.
    */

    const fade =

        1

        -

        Math.exp(

            -
            progress

            *
            9

        );


    /*
    Scale-in.
    */

    const scaleIn =

        0.85

        +

        0.15

        *
        fade;


    /*
    Pulse kecil.
    */

    const pulse =

        1

        +

        0.025

        *
        Math.sin(

            currentTime

            *
            4

        );


    const finalScale =

        scaleIn

        *
        pulse;


    /*
    ======================================================
    CENTER SHADOW FADE OUT
    ======================================================
    */

    const centerAge =

        currentTime

        -

        CENTER_START;


    const centerShadowDuration =
        1.2;


    const centerShadowStrength =

        clamp(

            1

            -

            centerAge
            /
            centerShadowDuration,

            0,

            1

        );


    const centerFontSize =

        Math.max(

            24,

            64

            *
            displayScale

        );


    ctx.save();


    ctx.translate(

        centerX,

        centerY

    );


    ctx.scale(

        finalScale,

        finalScale

    );


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.font =

        `bold ${centerFontSize}px Georgia`;


    /*
    ======================================================
    SHADOW / HALO CENTER

    Ini fade out.
    ======================================================
    */

    if (
        centerShadowStrength > 0
    ) {

        /*
        Halo besar.
        */

        ctx.save();


        ctx.scale(

            1.45,

            1.45

        );


        ctx.globalAlpha =

            fade

            *
            0.18

            *
            centerShadowStrength;


        ctx.fillStyle =
            "#94D8F4";


        ctx.fillText(

            CENTER_TEXT,

            0,

            0

        );


        ctx.restore();


        /*
        Halo kecil.
        */

        ctx.save();


        ctx.scale(

            1.18,

            1.18

        );


        ctx.globalAlpha =

            fade

            *
            0.25

            *
            centerShadowStrength;


        ctx.fillStyle =
            "#94D8F4";


        ctx.fillText(

            CENTER_TEXT,

            0,

            0

        );


        ctx.restore();

    }


    /*
    ======================================================
    CENTER TEXT UTAMA

    Glow tetap permanen.
    ======================================================
    */

    ctx.globalAlpha =
        fade;


    ctx.fillStyle =
        "#BDEDFB";


    ctx.shadowColor =
        "#94D8F4";


    /*
    GLOW TETAP ADA.
    */

    ctx.shadowBlur =

        Math.max(

            10,

            18

            *
            displayScale

        );


    ctx.fillText(

        CENTER_TEXT,

        0,

        0

    );


    ctx.restore();

}


/*
==========================================================
BACKGROUND
==========================================================
*/

function drawBackground() {

    ctx.fillStyle =
        BACKGROUND_COLOR;


    ctx.fillRect(

        0,

        0,

        width,

        height

    );

}


/*
==========================================================
ANIMATION LOOP
==========================================================
*/

function animate() {

    requestAnimationFrame(
        animate
    );


    drawBackground();


    if (
        !started
    ) {

        return;

    }


    /*
    Audio cuma jadi timer.

    Tidak ada beat sync.
    */

    const currentTime =

        Math.min(

            music.currentTime,

            SONG_DURATION

        );


    drawParticles(
        currentTime
    );


    drawCenterText(
        currentTime
    );

}


/*
==========================================================
START
==========================================================
*/

async function startExperience() {

    if (
        started
    ) {

        return;

    }


    music.currentTime =
        0;


    music.volume =
        0.65;


    try {

        await music.play();


        started =
            true;


        startScreen.classList.add(
            "hide"
        );

    }

    catch(error) {

        console.log(

            "Audio error:",

            error

        );

    }

}


/*
Klik sekali:
audio + animasi mulai.
*/

startScreen.addEventListener(

    "pointerdown",

    startExperience

);


/*
==========================================================
RESIZE
==========================================================
*/

function resizeCanvas() {

    const dpr =

        window.devicePixelRatio

        ||

        1;


    width =
        window.innerWidth;


    height =
        window.innerHeight;


    canvas.width =

        width

        *
        dpr;


    canvas.height =

        height

        *
        dpr;


    canvas.style.width =

        width

        +
        "px";


    canvas.style.height =

        height

        +
        "px";


    ctx.setTransform(

        dpr,

        0,

        0,

        dpr,

        0,

        0

    );


    /*
    Responsive scaling.
    */

    displayScale =

        Math.min(

            width
            /
            BASE_WIDTH,

            height
            /
            BASE_HEIGHT

        );


    /*
    Mobile adjustment.
    */

    if (
        width < 700
    ) {

        displayScale *=
            1.6;

    }


    heartScale =

        BASE_SCALE

        *
        displayScale;


    yOffset =

        BASE_Y_OFFSET

        *
        displayScale;


    centerX =
        width / 2;


    centerY =
        height / 2;


    createParticles();

}


/*
==========================================================
AUDIO FINISH
==========================================================
*/

music.addEventListener(

    "ended",

    function() {

        /*
        Tidak restart.

        Tampilan terakhir
        tetap terlihat.
        */

    }

);


/*
==========================================================
INITIALIZE
==========================================================
*/

window.addEventListener(

    "resize",

    resizeCanvas

);


resizeCanvas();


requestAnimationFrame(
    animate
);


</script>

</body>

</html>
