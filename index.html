<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blue Love Heart</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #102241;
    }

    body {
      position: relative;
      background:
        radial-gradient(circle at top, rgba(148,216,244,0.15), transparent 35%),
        radial-gradient(circle at bottom, rgba(30,122,193,0.18), transparent 30%),
        linear-gradient(180deg, #1C4562 0%, #102241 45%, #102241 100%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .title {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: #BDEDFB;
      font-size: clamp(14px, 2vw, 22px);
      letter-spacing: 4px;
      text-align: center;
      text-shadow:
        0 0 8px rgba(189,237,251,0.9),
        0 0 18px rgba(148,216,244,0.7),
        0 0 30px rgba(83,153,205,0.5);
      opacity: 0.9;
    }

    .sub {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: rgba(189,237,251,0.75);
      font-size: 12px;
      letter-spacing: 2px;
      text-align: center;
      text-shadow: 0 0 10px rgba(148,216,244,0.3);
    }
  </style>
</head>
<body>
  <div class="title">I LOVE YOU</div>
  <div class="sub">blue glowing heart</div>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let w, h, cx, cy, scale;
    let particles = [];
    let stars = [];
    let t = 0;

    const textValue = "I Love You";
    const heartCount = 180;
    const starCount = 110;

    const palette = [
      "#5399CD",
      "#BDEDFB",
      "#94D8F4",
      "#86C3EB",
      "#244C7E",
      "#2D5D9A",
      "#1E7AC1",
      "#143C8C",
      "#1C4562"
    ];

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      w = window.innerWidth;
      h = window.innerHeight;

      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      cx = w / 2;
      cy = h / 2 + 10;
      scale = Math.min(w, h) / 42;

      createStars();
      createHeart();
    }

    function heartPoint(a) {
      const x = 16 * Math.pow(Math.sin(a), 3);
      const y =
        13 * Math.cos(a) -
        5 * Math.cos(2 * a) -
        2 * Math.cos(3 * a) -
        Math.cos(4 * a);

      return { x, y };
    }

    class Star {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * w;
        this.y = Math.random() * h;
        this.r = Math.random() * 1.8 + 0.3;
        this.alpha = Math.random() * 0.8 + 0.2;
        this.speed = Math.random() * 0.25 + 0.05;
      }

      update() {
        this.y += this.speed;
        if (this.y > h + 10) {
          this.y = -10;
          this.x = Math.random() * w;
        }
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(189,237,251,${this.alpha})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = "#BDEDFB";
        ctx.fill();
      }
    }

    class LoveParticle {
      constructor(tx, ty, i, ring = 1) {
        this.tx = tx;
        this.ty = ty;
        this.x = cx + (Math.random() - 0.5) * 500;
        this.y = cy + (Math.random() - 0.5) * 500;
        this.vx = 0;
        this.vy = 0;
        this.i = i;
        this.ring = ring;

        this.size = ring === 1
          ? 8 + Math.random() * 3
          : 6 + Math.random() * 2;

        this.color = palette[Math.floor(Math.random() * palette.length)];
        this.alpha = ring === 1 ? 0.95 : 0.6;
        this.floatSeed = Math.random() * Math.PI * 2;
      }

      update(time) {
        const offsetX = Math.sin(time * 1.4 + this.floatSeed + this.i * 0.05) * (this.ring === 1 ? 3 : 2);
        const offsetY = Math.cos(time * 1.2 + this.floatSeed + this.i * 0.04) * (this.ring === 1 ? 3 : 2);

        const targetX = this.tx + offsetX;
        const targetY = this.ty + offsetY;

        const dx = targetX - this.x;
        const dy = targetY - this.y;

        this.vx += dx * 0.018;
        this.vy += dy * 0.018;

        this.vx *= 0.88;
        this.vy *= 0.88;

        this.x += this.vx;
        this.y += this.vy;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.font = `bold ${this.size}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.globalAlpha = this.alpha;

        ctx.shadowBlur = 14;
        ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;
        ctx.fillText(textValue, 0, 0);

        ctx.restore();
      }
    }

    function createStars() {
      stars = [];
      for (let i = 0; i < starCount; i++) {
        stars.push(new Star());
      }
    }

    function createHeart() {
      particles = [];

      for (let i = 0; i < heartCount; i++) {
        const a = (i / heartCount) * Math.PI * 2;
        const p = heartPoint(a);

        const x = cx + p.x * scale;
        const y = cy - p.y * scale;

        particles.push(new LoveParticle(x, y, i, 1));
      }

      const innerCount = 95;
      for (let i = 0; i < innerCount; i++) {
        const a = (i / innerCount) * Math.PI * 2;
        const p = heartPoint(a);

        const x = cx + p.x * scale * 0.78;
        const y = cy - p.y * scale * 0.78;

        particles.push(new LoveParticle(x, y, i, 2));
      }
    }

    function drawBackgroundGlow(time) {
      const pulse = 0.96 + Math.sin(time * 1.8) * 0.02;
      const radius = Math.min(w, h) * 0.34 * pulse;

      const glow = ctx.createRadialGradient(
        cx, cy, 20,
        cx, cy, radius
      );

      glow.addColorStop(0, "rgba(189,237,251,0.18)");
      glow.addColorStop(0.35, "rgba(148,216,244,0.12)");
      glow.addColorStop(0.65, "rgba(83,153,205,0.08)");
      glow.addColorStop(1, "rgba(16,34,65,0)");

      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, w, h);
    }

    function drawOuterAura(time) {
      ctx.save();
      ctx.beginPath();

      for (let i = 0; i <= 220; i++) {
        const a = (i / 220) * Math.PI * 2;
        const p = heartPoint(a);

        const pulse = 1 + Math.sin(time * 2) * 0.018;
        const x = cx + p.x * scale * 1.08 * pulse;
        const y = cy - p.y * scale * 1.08 * pulse;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      ctx.closePath();
      ctx.strokeStyle = "rgba(148,216,244,0.35)";
      ctx.lineWidth = 2;
      ctx.shadowBlur = 25;
      ctx.shadowColor = "#94D8F4";
      ctx.stroke();
      ctx.restore();
    }

    function animate() {
      requestAnimationFrame(animate);
      t += 0.016;

      ctx.clearRect(0, 0, w, h);

      drawBackgroundGlow(t);

      stars.forEach(star => {
        star.update();
        star.draw();
      });

      drawOuterAura(t);

      particles.forEach(p => {
        p.update(t);
        p.draw();
      });
    }

    window.addEventListener("resize", resize);

    resize();
    animate();
  </script>
</body>
</html>
