<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>I Love You ❤️</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background:
                radial-gradient(
                    circle at center,
                    #25000d 0%,
                    #0d0005 40%,
                    #000000 80%
                );

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* ==========================
           CANVAS
        ========================== */

        #canvas {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            z-index: 1;
        }


        /* ==========================
           CENTER TEXT
        ========================== */

        .center-content {
            position: fixed;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            text-align: center;

            z-index: 5;

            pointer-events: none;

            opacity: 0;

            animation:
                showCenter
                2s
                ease
                4s
                forwards;
        }


        .center-content h1 {
            font-size:
                clamp(
                    24px,
                    4vw,
                    52px
                );

            color: #ffffff;

            text-shadow:
                0 0 5px #ffffff,
                0 0 10px #ff2f6d,
                0 0 20px #ff2f6d,
                0 0 40px #ff0055;

            letter-spacing: 3px;

            animation:
                centerPulse
                2s
                ease-in-out
                infinite;
        }


        .center-content p {
            margin-top: 12px;

            font-size:
                clamp(
                    11px,
                    1.3vw,
                    17px
                );

            letter-spacing: 4px;

            color: #ffb6cb;

            text-shadow:
                0 0 10px
                rgba(
                    255,
                    80,
                    135,
                    0.8
                );
        }


        /* ==========================
           BOTTOM INFO
        ========================== */

        .instruction {
            position: fixed;

            bottom: 25px;
            left: 50%;

            transform:
                translateX(-50%);

            z-index: 10;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.55
                );

            font-size: 12px;

            letter-spacing: 2px;

            text-align: center;

            animation:
                blink
                2s
                ease-in-out
                infinite;
        }


        /* ==========================
           ANIMATIONS
        ========================== */

        @keyframes showCenter {

            from {
                opacity: 0;

                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    scale(0.8);
            }

            to {
                opacity: 1;

                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    scale(1);
            }

        }


        @keyframes centerPulse {

            0%,
            100% {

                transform:
                    scale(1);

            }

            50% {

                transform:
                    scale(1.08);

            }

        }


        @keyframes blink {

            0%,
            100% {

                opacity: 0.3;

            }

            50% {

                opacity: 0.8;

            }

        }


        /* ==========================
           MOBILE
        ========================== */

        @media
        (max-width: 600px) {

            .center-content h1 {
                letter-spacing: 2px;
            }

            .center-content p {
                letter-spacing: 2px;
            }

            .instruction {
                bottom: 15px;
                font-size: 9px;
            }

        }

    </style>
</head>


<body>


    <canvas id="canvas"></canvas>


    <div class="center-content">

        <h1>
            I LOVE YOU
        </h1>

        <p>
            FOREVER ❤️
        </p>

    </div>


    <div class="instruction">
        CLICK ANYWHERE ❤️
    </div>


    <script>

        /* ==========================
           CANVAS SETUP
        ========================== */

        const canvas =
            document.getElementById(
                "canvas"
            );

        const ctx =
            canvas.getContext(
                "2d"
            );


        let width;
        let height;

        let centerX;
        let centerY;

        let heartScale;

        let textParticles = [];
        let stars = [];

        let animationTime = 0;

        let exploded = false;


        /* ==========================
           TEXT SETTINGS
        ========================== */

        const LOVE_TEXT =
            "I Love You";

        const TOTAL_TEXT =
            170;

        const TOTAL_STARS =
            100;


        /* ==========================
           RESIZE CANVAS
        ========================== */

        function resizeCanvas() {

            const dpr =
                window.devicePixelRatio
                || 1;


            width =
                window.innerWidth;

            height =
                window.innerHeight;


            canvas.width =
                width * dpr;

            canvas.height =
                height * dpr;


            canvas.style.width =
                width + "px";

            canvas.style.height =
                height + "px";


            ctx.setTransform(
                dpr,
                0,
                0,
                dpr,
                0,
                0
            );


            centerX =
                width / 2;

            centerY =
                height / 2;


            heartScale =
                Math.min(
                    width,
                    height
                ) / 38;


            createHeart();

        }


        /* ==========================
           HEART FORMULA
        ========================== */

        function getHeartPoint(t) {

            const x =
                16 *
                Math.pow(
                    Math.sin(t),
                    3
                );


            const y =

                13 *
                Math.cos(t)

                -

                5 *
                Math.cos(
                    2 * t
                )

                -

                2 *
                Math.cos(
                    3 * t
                )

                -

                Math.cos(
                    4 * t
                );


            return {
                x: x,
                y: y
            };

        }


        /* ==========================
           TEXT PARTICLE CLASS
        ========================== */

        class LoveText {

            constructor(
                targetX,
                targetY,
                index
            ) {

                this.targetX =
                    targetX;

                this.targetY =
                    targetY;


                this.x =
                    Math.random()
                    * width;

                this.y =
                    Math.random()
                    * height;


                this.vx = 0;
                this.vy = 0;


                this.index =
                    index;


                this.size =
                    8
                    +
                    Math.random()
                    * 4;


                this.rotation =
                    Math.random()
                    * Math.PI
                    * 2;


                this.opacity =
                    0.4
                    +
                    Math.random()
                    * 0.6;


                const colors = [

                    "#ff1457",
                    "#ff2f6d",
                    "#ff4c85",
                    "#ff6b9c",
                    "#ff8eb3",
                    "#ffffff"

                ];


                this.color =
                    colors[
                        Math.floor(
                            Math.random()
                            *
                            colors.length
                        )
                    ];

            }


            update(pulse) {

                const pulsedX =

                    centerX

                    +

                    (
                        this.targetX
                        -
                        centerX
                    )

                    *
                    pulse;


                const pulsedY =

                    centerY

                    +

                    (
                        this.targetY
                        -
                        centerY
                    )

                    *
                    pulse;


                const dx =
                    pulsedX
                    -
                    this.x;


                const dy =
                    pulsedY
                    -
                    this.y;


                this.vx +=
                    dx
                    * 0.015;


                this.vy +=
                    dy
                    * 0.015;


                this.vx *=
                    0.87;

                this.vy *=
                    0.87;


                this.x +=
                    this.vx;

                this.y +=
                    this.vy;


                this.rotation +=
                    Math.sin(
                        animationTime
                        +
                        this.index
                    )
                    * 0.0005;

            }


            draw() {

                ctx.save();


                ctx.translate(
                    this.x,
                    this.y
                );


                ctx.rotate(
                    this.rotation
                );


                ctx.font =
                    `bold ${this.size}px Arial`;


                ctx.textAlign =
                    "center";


                ctx.textBaseline =
                    "middle";


                ctx.shadowBlur =
                    10;


                ctx.shadowColor =
                    this.color;


                ctx.fillStyle =
                    this.color;


                ctx.globalAlpha =
                    this.opacity;


                ctx.fillText(
                    LOVE_TEXT,
                    0,
                    0
                );


                ctx.restore();

            }


            explode() {

                const angle =
                    Math.atan2(
                        this.y
                        -
                        centerY,

                        this.x
                        -
                        centerX
                    );


                const power =
                    10
                    +
                    Math.random()
                    * 20;


                this.vx +=
                    Math.cos(angle)
                    * power;


                this.vy +=
                    Math.sin(angle)
                    * power;

            }

        }


        /* ==========================
           STAR PARTICLE
        ========================== */

        class Star {

            constructor() {

                this.reset();

            }


            reset() {

                this.x =
                    Math.random()
                    * width;


                this.y =
                    Math.random()
                    * height;


                this.size =
                    Math.random()
                    * 1.7
                    +
                    0.3;


                this.speed =
                    Math.random()
                    * 0.25
                    +
                    0.05;


                this.opacity =
                    Math.random();

            }


            update() {

                this.y -=
                    this.speed;


                this.opacity +=
                    Math.sin(
                        animationTime
                        +
                        this.x
                    )
                    * 0.005;


                if (
                    this.y < -10
                ) {

                    this.y =
                        height + 10;

                    this.x =
                        Math.random()
                        * width;

                }

            }


            draw() {

                ctx.beginPath();


                ctx.arc(
                    this.x,
                    this.y,
                    this.size,
                    0,
                    Math.PI * 2
                );


                ctx.fillStyle =
                    `rgba(
                        255,
                        170,
                        200,
                        ${
                            Math.max(
                                0.1,
                                Math.min(
                                    this.opacity,
                                    1
                                )
                            )
                        }
                    )`;


                ctx.fill();

            }

        }


        /* ==========================
           CREATE HEART
        ========================== */

        function createHeart() {

            textParticles = [];


            for (
                let i = 0;
                i < TOTAL_TEXT;
                i++
            ) {

                const t =

                    (
                        i
                        /
                        TOTAL_TEXT
                    )

                    *
                    Math.PI
                    *
                    2;


                const point =
                    getHeartPoint(t);


                const targetX =

                    centerX

                    +

                    point.x
                    *
                    heartScale;


                const targetY =

                    centerY

                    -

                    point.y
                    *
                    heartScale;


                textParticles.push(

                    new LoveText(
                        targetX,
                        targetY,
                        i
                    )

                );

            }


            createInnerHeart();

        }


        /* ==========================
           SECOND INNER HEART
        ========================== */

        function createInnerHeart() {

            const innerTotal =
                75;


            for (
                let i = 0;
                i < innerTotal;
                i++
            ) {

                const t =

                    (
                        i
                        /
                        innerTotal
                    )

                    *
                    Math.PI
                    *
                    2;


                const point =
                    getHeartPoint(t);


                const targetX =

                    centerX

                    +

                    point.x
                    *
                    heartScale
                    *
                    0.78;


                const targetY =

                    centerY

                    -

                    point.y
                    *
                    heartScale
                    *
                    0.78;


                const love =
                    new LoveText(
                        targetX,
                        targetY,
                        i
                    );


                love.size =
                    6
                    +
                    Math.random()
                    * 3;


                love.opacity =
                    0.35;


                textParticles.push(
                    love
                );

            }

        }


        /* ==========================
           CREATE STARS
        ========================== */

        function createStars() {

            stars = [];


            for (
                let i = 0;
                i < TOTAL_STARS;
                i++
            ) {

                stars.push(
                    new Star()
                );

            }

        }


        /* ==========================
           BACKGROUND GLOW
        ========================== */

        function drawGlow() {

            const gradient =

                ctx.createRadialGradient(

                    centerX,
                    centerY,
                    10,

                    centerX,
                    centerY,

                    Math.min(
                        width,
                        height
                    )
                    * 0.45

                );


            gradient.addColorStop(
                0,
                "rgba(255, 0, 80, 0.08)"
            );


            gradient.addColorStop(
                0.5,
                "rgba(255, 0, 80, 0.03)"
            );


            gradient.addColorStop(
                1,
                "rgba(0, 0, 0, 0)"
            );


            ctx.fillStyle =
                gradient;


            ctx.fillRect(
                0,
                0,
                width,
                height
            );

        }


        /* ==========================
           SMALL HEARTS
        ========================== */

        function drawSmallHeart(
            x,
            y,
            size,
            opacity
        ) {

            ctx.save();


            ctx.translate(
                x,
                y
            );


            ctx.scale(
                size,
                size
            );


            ctx.beginPath();


            ctx.moveTo(
                0,
                0.3
            );


            ctx.bezierCurveTo(
                -1,
                -0.5,
                -1.7,
                0.6,
                0,
                1.8
            );


            ctx.bezierCurveTo(
                1.7,
                0.6,
                1,
                -0.5,
                0,
                0.3
            );


            ctx.fillStyle =
                `rgba(
                    255,
                    50,
                    110,
                    ${opacity}
                )`;


            ctx.fill();


            ctx.restore();

        }


        /* ==========================
           ANIMATION LOOP
        ========================== */

        function animate() {

            requestAnimationFrame(
                animate
            );


            animationTime +=
                0.015;


            ctx.clearRect(
                0,
                0,
                width,
                height
            );


            drawGlow();


            stars.forEach(

                star => {

                    star.update();

                    star.draw();

                }

            );


            const pulse =

                1

                +

                Math.sin(
                    animationTime
                    * 2
                )

                *
                0.018;


            textParticles.forEach(

                particle => {

                    particle.update(
                        pulse
                    );

                    particle.draw();

                }

            );


            for (
                let i = 0;
                i < 8;
                i++
            ) {

                const angle =

                    animationTime
                    * 0.4

                    +

                    i
                    *
                    Math.PI
                    /
                    4;


                const radius =

                    Math.min(
                        width,
                        height
                    )

                    *
                    0.35;


                const x =

                    centerX

                    +

                    Math.cos(angle)
                    *
                    radius;


                const y =

                    centerY

                    +

                    Math.sin(angle)
                    *
                    radius
                    *
                    0.5;


                drawSmallHeart(

                    x,
                    y,

                    2
                    +
                    Math.sin(
                        animationTime
                        +
                        i
                    ),

                    0.3

                );

            }

        }


        /* ==========================
           CLICK EFFECT
        ========================== */

        function heartExplosion() {

            if (
                exploded
            ) {

                return;

            }


            exploded = true;


            textParticles.forEach(

                particle => {

                    particle.explode();

                }

            );


            setTimeout(

                () => {

                    exploded =
                        false;

                },

                1200

            );

        }


        /* ==========================
           MOUSE SPARK
        ========================== */

        function mouseSpark(
            x,
            y
        ) {

            for (
                let i = 0;
                i < 12;
                i++
            ) {

                const size =
                    Math.random()
                    * 3
                    +
                    1;


                drawSmallHeart(

                    x
                    +
                    (
                        Math.random()
                        -
                        0.5
                    )
                    * 80,

                    y
                    +
                    (
                        Math.random()
                        -
                        0.5
                    )
                    * 80,

                    size,

                    0.6

                );

            }

        }


        /* ==========================
           EVENTS
        ========================== */

        window.addEventListener(

            "resize",

            () => {

                resizeCanvas();

                createStars();

            }

        );


        window.addEventListener(

            "click",

            event => {

                heartExplosion();


                mouseSpark(
                    event.clientX,
                    event.clientY
                );

            }

        );


        window.addEventListener(

            "touchstart",

            () => {

                heartExplosion();

            }

        );


        /* ==========================
           START
        ========================== */

        resizeCanvas();

        createStars();

        animate();


    </script>

</body>
</html>
