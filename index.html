<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>I Love You 💙</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {

            background:
                radial-gradient(
                    circle at 50% 45%,
                    #1C4562 0%,
                    #102241 45%,
                    #09162c 100%
                );

            display: flex;
            justify-content: center;
            align-items: center;

        }

        canvas {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

        }

    </style>

</head>


<body>

<canvas id="canvas"></canvas>


<script>

    /* =========================================
       CANVAS
    ========================================= */

    const canvas =
        document.getElementById("canvas");

    const ctx =
        canvas.getContext("2d");


    let width;
    let height;

    let centerX;
    let centerY;

    let heartScale;

    let time = 0;


    /* =========================================
       COLOR PALETTE
    ========================================= */

    const backgroundColor =
        "#102241";


    const colors = [

        "#5399CD",
        "#BDEDFB",
        "#94D8F4",
        "#86C3EB",
        "#244C7E",
        "#2D5D9A",
        "#1E7AC1",
        "#143C8C",
        "#1C4562"

    ];


    /* =========================================
       RESIZE
    ========================================= */

    function resizeCanvas() {

        const dpr =
            window.devicePixelRatio || 1;


        width =
            window.innerWidth;

        height =
            window.innerHeight;


        canvas.width =
            width * dpr;

        canvas.height =
            height * dpr;


        canvas.style.width =
            width + "px";

        canvas.style.height =
            height + "px";


        ctx.setTransform(
            dpr,
            0,
            0,
            dpr,
            0,
            0
        );


        centerX =
            width / 2;


        centerY =
            height / 2;


        heartScale =

            Math.min(
                width,
                height
            )

            / 39;

    }


    /* =========================================
       HEART FORMULA
    ========================================= */

    function getHeartPoint(angle) {

        const x =

            16 *

            Math.pow(
                Math.sin(angle),
                3
            );


        const y =

            13 * Math.cos(angle)

            -

            5 * Math.cos(
                2 * angle
            )

            -

            2 * Math.cos(
                3 * angle
            )

            -

            Math.cos(
                4 * angle
            );


        return {

            x:
                centerX
                +
                x * heartScale,

            y:
                centerY
                -
                y * heartScale

        };

    }


    /* =========================================
       CREATE HEART PATH
    ========================================= */

    function createHeartPath() {

        ctx.beginPath();


        const totalPoints =
            500;


        for (
            let i = 0;
            i <= totalPoints;
            i++
        ) {

            const angle =

                (
                    i / totalPoints
                )

                *

                Math.PI * 2;


            const point =
                getHeartPoint(angle);


            if (
                i === 0
            ) {

                ctx.moveTo(
                    point.x,
                    point.y
                );

            }

            else {

                ctx.lineTo(
                    point.x,
                    point.y
                );

            }

        }


        ctx.closePath();

    }


    /* =========================================
       HEART BACKGROUND GLOW
    ========================================= */

    function drawHeartGlow() {

        ctx.save();


        createHeartPath();


        ctx.shadowColor =
            "#94D8F4";


        ctx.shadowBlur =
            45;


        ctx.strokeStyle =
            "rgba(148,216,244,0.22)";


        ctx.lineWidth =
            6;


        ctx.stroke();


        ctx.restore();

    }


    /* =========================================
       REPEATED I LOVE YOU TEXT
    ========================================= */

    function drawTextHeart() {

        ctx.save();


        createHeartPath();

        ctx.clip();


        const heartWidth =
            heartScale * 34;


        const heartHeight =
            heartScale * 31;


        const left =
            centerX
            -
            heartWidth / 2;


        const top =
            centerY
            -
            heartHeight / 2;


        const lineHeight =

            Math.max(
                10,
                heartScale * 0.72
            );


        const fontSize =

            Math.max(
                7,
                heartScale * 0.47
            );


        let row =
            0;


        for (

            let y = top - 20;

            y <
            top + heartHeight + 30;

            y += lineHeight

        ) {

            const color =

                colors[
                    row
                    %
                    colors.length
                ];


            /*
              Gerakan kecil horizontal
              supaya teks terasa hidup,
              bukan beterbangan.
            */

            const movement =

                Math.sin(
                    time * 0.7
                    +
                    row * 0.7
                )

                * 4;


            let x =

                left
                -
                100
                +
                movement;


            ctx.font =

                `500 ${fontSize}px Arial`;


            ctx.textBaseline =
                "middle";


            ctx.fillStyle =
                color;


            ctx.shadowColor =
                color;


            ctx.shadowBlur =
                7;


            /*
              Isi satu baris dengan
              tulisan I Love You
            */

            while (

                x
                <
                left
                +
                heartWidth
                +
                120

            ) {

                ctx.fillText(

                    "I Love You",

                    x,

                    y

                );


                x +=

                    fontSize
                    *
                    5.8;

            }


            row++;

        }


        ctx.restore();

    }


    /* =========================================
       ROTATING SHADOW
       INI MOTION UTAMA SEPERTI VIDEO
    ========================================= */

    function drawMovingShadow() {

        ctx.save();


        createHeartPath();

        ctx.clip();


        /*
          Shadow bergerak mengelilingi
          pusat hati.
        */

        const angle =
            time * 1.35;


        const heartRadius =

            Math.min(
                width,
                height
            )

            * 0.23;


        /*
          Posisi shadow berputar.
        */

        const orbitRadius =

            heartRadius
            *
            0.60;


        const shadowX =

            centerX

            +

            Math.cos(angle)
            *
            orbitRadius;


        const shadowY =

            centerY

            +

            Math.sin(angle)
            *
            orbitRadius;


        /*
          Ukuran shadow berubah sedikit.

          Ini yang bikin kadang hati
          hampir penuh dan kadang
          sebagian besar gelap.
        */

        const shadowSize =

            heartRadius

            *

            (
                0.80

                +

                Math.sin(
                    time * 1.35
                )

                * 0.22
            );


        const gradient =

            ctx.createRadialGradient(

                shadowX,
                shadowY,
                shadowSize * 0.05,

                shadowX,
                shadowY,
                shadowSize

            );


        gradient.addColorStop(

            0,

            "rgba(9,22,44,1)"

        );


        gradient.addColorStop(

            0.38,

            "rgba(9,22,44,0.98)"

        );


        gradient.addColorStop(

            0.62,

            "rgba(16,34,65,0.88)"

        );


        gradient.addColorStop(

            0.82,

            "rgba(16,34,65,0.35)"

        );


        gradient.addColorStop(

            1,

            "rgba(16,34,65,0)"

        );


        ctx.fillStyle =
            gradient;


        ctx.fillRect(

            centerX
            -
            heartRadius * 2,

            centerY
            -
            heartRadius * 2,

            heartRadius * 4,

            heartRadius * 4

        );


        ctx.restore();

    }


    /* =========================================
       SOFT BLUE LIGHT
    ========================================= */

    function drawBlueAura() {

        const radius =

            Math.min(
                width,
                height
            )

            * 0.38;


        const gradient =

            ctx.createRadialGradient(

                centerX,
                centerY,
                20,

                centerX,
                centerY,
                radius

            );


        gradient.addColorStop(

            0,

            "rgba(148,216,244,0.10)"

        );


        gradient.addColorStop(

            0.4,

            "rgba(83,153,205,0.06)"

        );


        gradient.addColorStop(

            1,

            "rgba(16,34,65,0)"

        );


        ctx.fillStyle =
            gradient;


        ctx.fillRect(
            0,
            0,
            width,
            height
        );

    }


    /* =========================================
       CENTER TEXT
    ========================================= */

    function drawCenterText() {

        ctx.save();


        /*
          Sedikit area gelap di belakang
          text tengah supaya tetap jelas.
        */

        const centerGlow =

            ctx.createRadialGradient(

                centerX,
                centerY,
                0,

                centerX,
                centerY,
                heartScale * 6

            );


        centerGlow.addColorStop(

            0,

            "rgba(16,34,65,0.82)"

        );


        centerGlow.addColorStop(

            0.55,

            "rgba(16,34,65,0.30)"

        );


        centerGlow.addColorStop(

            1,

            "rgba(16,34,65,0)"

        );


        ctx.fillStyle =
            centerGlow;


        ctx.fillRect(

            centerX
            -
            heartScale * 8,

            centerY
            -
            heartScale * 4,

            heartScale * 16,

            heartScale * 8

        );


        /*
          Tulisan utama
        */

        const centerFont =

            Math.max(
                18,
                heartScale * 1.25
            );


        ctx.font =

            `500 ${centerFont}px Georgia`;


        ctx.textAlign =
            "center";


        ctx.textBaseline =
            "middle";


        ctx.fillStyle =
            "#BDEDFB";


        ctx.shadowColor =
            "#94D8F4";


        ctx.shadowBlur =
            16;


        ctx.fillText(

            "I Love you",

            centerX,

            centerY

        );


        ctx.restore();

    }


    /* =========================================
       EXTRA SMALL SPARKLES
    ========================================= */

    function drawSparkles() {

        ctx.save();


        const sparkleCount =
            18;


        for (

            let i = 0;

            i < sparkleCount;

            i++

        ) {

            const angle =

                (
                    i
                    /
                    sparkleCount
                )

                *
                Math.PI
                *
                2;


            const radius =

                heartScale

                *

                (
                    15

                    +

                    Math.sin(
                        time
                        +
                        i
                    )

                    * 0.5
                );


            const x =

                centerX

                +

                Math.cos(angle)
                *
                radius;


            const y =

                centerY

                +

                Math.sin(angle)
                *
                radius
                *
                0.8;


            const opacity =

                0.25

                +

                (
                    Math.sin(
                        time * 2
                        +
                        i
                    )

                    +
                    1
                )

                *
                0.18;


            ctx.beginPath();


            ctx.arc(

                x,
                y,

                1.2,

                0,

                Math.PI * 2

            );


            ctx.fillStyle =

                `rgba(
                    189,
                    237,
                    251,
                    ${opacity}
                )`;


            ctx.shadowColor =
                "#BDEDFB";


            ctx.shadowBlur =
                10;


            ctx.fill();

        }


        ctx.restore();

    }


    /* =========================================
       ANIMATION
    ========================================= */

    function animate() {

        requestAnimationFrame(
            animate
        );


        time +=
            0.016;


        /*
          Background
        */

        ctx.clearRect(
            0,
            0,
            width,
            height
        );


        ctx.fillStyle =
            backgroundColor;


        ctx.fillRect(
            0,
            0,
            width,
            height
        );


        /*
          Background blue aura
        */

        drawBlueAura();


        /*
          Glow di sekitar heart
        */

        drawHeartGlow();


        /*
          Semua tulisan sudah
          langsung membentuk hati.
        */

        drawTextHeart();


        /*
          Shadow berputar.

          Ini bagian motion utama.
        */

        drawMovingShadow();


        /*
          Sparkle kecil.
        */

        drawSparkles();


        /*
          Text tengah dibuat paling akhir
          supaya tidak ikut hilang.
        */

        drawCenterText();

    }


    /* =========================================
       START
    ========================================= */

    window.addEventListener(

        "resize",

        resizeCanvas

    );


    resizeCanvas();

    animate();

</script>

</body>

</html>
