<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>I Love You 💙</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #102241;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>


<body>

<canvas id="canvas"></canvas>


<script>

    /*
    ==========================================================
    BASIC SETTINGS
    ==========================================================
    */

    const canvas =
        document.getElementById("canvas");

    const ctx =
        canvas.getContext("2d");


    /*
    Ukuran referensi sama seperti Python
    */

    const BASE_WIDTH = 1900;
    const BASE_HEIGHT = 1000;

    const BASE_SCALE = 24;
    const BASE_Y_OFFSET = 60;

    const FPS = 60;


    /*
    Warna background dari palette kamu
    */

    const BACKGROUND_COLOR =
        "#102241";


    /*
    Kata-katanya sama seperti Python original
    */

    const WORDS = [
        "i love you",
        "I LOVE YOU",
        "love you"
    ];


    /*
    Tulisan besar di tengah
    */

    const CENTER_TEXT =
        "I Love you";


    /*
    Palette biru yang kamu kirim

    Background:
    #102241

    Sisanya dipakai random untuk teks.
    */

    const COLORS = [

        "#5399CD",
        "#BDEDFB",
        "#94D8F4",
        "#86C3EB",
        "#244C7E",
        "#2D5D9A",
        "#1E7AC1",
        "#143C8C",
        "#1C4562"

    ];


    /*
    ==========================================================
    CANVAS SIZE
    ==========================================================
    */

    let width = 0;
    let height = 0;

    let displayScale = 1;

    let heartScale = BASE_SCALE;
    let yOffset = BASE_Y_OFFSET;

    let centerX = 0;
    let centerY = 0;

    let particles = [];

    let outlineParticles = [];
    let fillParticles = [];

    let frame = 0;

    let fillStartFrame = 0;
    let centerStartFrame = 0;


    /*
    ==========================================================
    RANDOM HELPERS
    ==========================================================
    */

    function randomFloat(min, max) {

        return (
            Math.random()
            *
            (max - min)
            +
            min
        );

    }


    function randomInt(min, max) {

        return Math.floor(

            Math.random()
            *
            (max - min + 1)

        ) + min;

    }


    function randomChoice(array) {

        return array[
            Math.floor(
                Math.random()
                *
                array.length
            )
        ];

    }


    /*
    ==========================================================
    PARTICLE CLASS

    Sama seperti class Particle pada Python.
    ==========================================================
    */

    class Particle {

        constructor(
            x,
            y,
            order,
            kind
        ) {

            this.x = x;

            this.y = y;

            this.order = order;

            this.kind = kind;


            /*
            Random word
            */

            this.word =
                randomChoice(WORDS);


            /*
            Random color
            */

            this.color =
                randomChoice(COLORS);


            /*
            Mulai invisible
            */

            this.alpha = 0;


            /*
            Setiap particle punya
            phase flicker berbeda
            */

            this.flicker =
                randomFloat(
                    0,
                    Math.PI * 2
                );


            this.delay = 0;


            /*
            Sama seperti:

            random.uniform(0.85, 1.15)
            */

            this.sizeMult =
                randomFloat(
                    0.85,
                    1.15
                );

        }

    }


    /*
    ==========================================================
    HEART FORMULA

    Sama seperti Python:

    x = 16 sin³(t)

    y =
    13 cos(t)
    - 5 cos(2t)
    - 2 cos(3t)
    - cos(4t)
    ==========================================================
    */

    function heartXY(t) {

        const x =

            16
            *
            Math.pow(
                Math.sin(t),
                3
            );


        const y =

            13
            *
            Math.cos(t)

            -

            5
            *
            Math.cos(
                2 * t
            )

            -

            2
            *
            Math.cos(
                3 * t
            )

            -

            Math.cos(
                4 * t
            );


        /*
        Python mengembalikan:
        x, -y
        */

        return {

            x: x,

            y: -y

        };

    }


    /*
    ==========================================================
    CONVERT HEART COORDINATE TO SCREEN
    ==========================================================
    */

    function toScreen(
        x,
        y
    ) {

        return {

            x:
                x
                *
                heartScale
                +
                centerX,

            y:
                y
                *
                heartScale
                +
                centerY
                +
                yOffset

        };

    }


    /*
    ==========================================================
    DISTANCE
    ==========================================================
    */

    function distance(
        x1,
        y1,
        x2,
        y2
    ) {

        return Math.hypot(
            x1 - x2,
            y1 - y2
        );

    }


    /*
    ==========================================================
    BUILD OUTLINE PARTICLES

    Sama seperti:

    build_outline_particles(
        n_outline=160,
        min_gap=34
    )
    ==========================================================
    */

    function buildOutlineParticles(
        nOutline = 160,
        minGap = 34
    ) {

        const result = [];

        const placed = [];


        /*
        Gap ikut mengecil / membesar
        sesuai ukuran layar.
        */

        const scaledGap =
            minGap
            *
            displayScale;


        for (
            let i = 0;
            i < nOutline;
            i++
        ) {

            const t =

                (
                    i / nOutline
                )

                *
                2
                *
                Math.PI;


            const heart =
                heartXY(t);


            const screen =
                toScreen(
                    heart.x,
                    heart.y
                );


            /*
            Cek jarak minimum
            */

            let tooClose =
                false;


            for (
                const point
                of placed
            ) {

                if (

                    distance(

                        screen.x,
                        screen.y,

                        point.x,
                        point.y

                    )

                    <
                    scaledGap

                ) {

                    tooClose =
                        true;

                    break;

                }

            }


            if (
                tooClose
            ) {

                continue;

            }


            placed.push({

                x: screen.x,

                y: screen.y

            });


            /*
            order tetap menggunakan i,
            persis seperti Python.
            */

            result.push(

                new Particle(

                    screen.x,

                    screen.y,

                    i,

                    "outline"

                )

            );

        }


        return result;

    }


    /*
    ==========================================================
    BUILD FILL PARTICLES

    Sama seperti Python:

    t = random.uniform(0, 2π)

    r = random.uniform(0, 0.86)

    bx, by = heart_xy(t)

    px = bx * r
    py = by * r
    ==========================================================
    */

    function buildFillParticles(
        nFill = 130,
        minGap = 46
    ) {

        const result = [];

        const placed = [];


        let attempts = 0;


        const maxAttempts =
            nFill
            *
            80;


        const scaledGap =
            minGap
            *
            displayScale;


        while (

            result.length
            <
            nFill

            &&

            attempts
            <
            maxAttempts

        ) {

            attempts++;


            /*
            Random angle
            */

            const t =
                randomFloat(
                    0,
                    Math.PI * 2
                );


            /*
            Random distance ke tengah
            */

            const r =
                randomFloat(
                    0,
                    0.86
                );


            const heart =
                heartXY(t);


            const px =
                heart.x
                *
                r;


            const py =
                heart.y
                *
                r;


            const screen =
                toScreen(
                    px,
                    py
                );


            /*
            Check minimum gap
            */

            let tooClose =
                false;


            for (
                const point
                of placed
            ) {

                if (

                    distance(

                        screen.x,
                        screen.y,

                        point.x,
                        point.y

                    )

                    <
                    scaledGap

                ) {

                    tooClose =
                        true;

                    break;

                }

            }


            if (
                tooClose
            ) {

                continue;

            }


            placed.push({

                x: screen.x,

                y: screen.y

            });


            /*
            Ini bagian penting.

            Fill muncul RANDOM,
            bukan berurutan.

            Sama persis dengan:

            random.randint(0, 320)
            */

            result.push(

                new Particle(

                    screen.x,

                    screen.y,

                    randomInt(
                        0,
                        320
                    ),

                    "fill"

                )

            );

        }


        return result;

    }


    /*
    ==========================================================
    DRAW TEXT WITH GLOW

    Meniru draw_glow_text() Python.

    Ada:
    - glow besar 2.4x
    - glow kecil 1.6x
    - text asli
    ==========================================================
    */

    function drawGlowText(
        particle,
        alpha
    ) {

        if (
            alpha <= 0
        ) {

            return;

        }


        /*
        Ukuran font sama:
        outline 20
        fill 17

        lalu dikalikan sizeMult.
        */

        const baseSize =

            particle.kind
            ===
            "outline"

            ?

            20

            :

            17;


        const fontSize =

            baseSize

            *
            displayScale

            *
            particle.sizeMult;


        /*
        Jangan sampai terlalu kecil
        kalau dibuka dari HP.
        */

        const finalFontSize =

            Math.max(
                fontSize,
                5
            );


        ctx.save();


        ctx.textAlign =
            "center";


        ctx.textBaseline =
            "middle";


        ctx.font =

            `bold ${finalFontSize}px Arial`;


        /*
        ------------------------------
        GLOW BESAR
        ------------------------------
        */

        if (
            alpha > 10
        ) {

            ctx.save();


            ctx.translate(

                particle.x,

                particle.y

            );


            ctx.scale(
                2.4,
                2.4
            );


            ctx.globalAlpha =

                (
                    alpha / 255
                )

                /
                7;


            ctx.fillStyle =
                particle.color;


            ctx.fillText(

                particle.word,

                0,

                0

            );


            ctx.restore();


            /*
            --------------------------
            GLOW KECIL
            --------------------------
            */

            ctx.save();


            ctx.translate(

                particle.x,

                particle.y

            );


            ctx.scale(
                1.6,
                1.6
            );


            ctx.globalAlpha =

                (
                    alpha / 255
                )

                /
                3;


            ctx.fillStyle =
                particle.color;


            ctx.fillText(

                particle.word,

                0,

                0

            );


            ctx.restore();

        }


        /*
        ------------------------------
        TEXT UTAMA
        ------------------------------
        */

        ctx.globalAlpha =
            alpha
            /
            255;


        ctx.fillStyle =
            particle.color;


        /*
        Glow tambahan browser,
        supaya warna biru lebih cantik.
        */

        ctx.shadowColor =
            particle.color;


        ctx.shadowBlur =

            Math.max(
                4,
                7 * displayScale
            );


        ctx.fillText(

            particle.word,

            particle.x,

            particle.y

        );


        ctx.restore();

    }


    /*
    ==========================================================
    CENTER TEXT
    ==========================================================
    */

    function drawCenterText() {

        if (
            frame
            <=
            centerStartFrame
        ) {

            return;

        }


        /*
        Sama seperti Python:

        progress =
        min(
            1,
            (frame - center_start)
            / 60
        )
        */

        const progress =

            Math.min(

                1,

                (
                    frame
                    -
                    centerStartFrame
                )

                /
                60

            );


        /*
        Sama seperti:

        255 *
        (1 - exp(-progress * 8))
        */

        const centerAlpha =

            Math.floor(

                255

                *

                (
                    1

                    -

                    Math.exp(
                        -progress
                        *
                        8
                    )
                )

            );


        /*
        Pulse kecil hanya
        pada center text.

        Sama seperti Python.
        */

        const pulse =

            1

            +

            0.025

            *
            Math.sin(
                frame
                *
                0.05
            );


        /*
        Python:
        Georgia 54 bold.
        */

        const centerFontSize =

            Math.max(

                54
                *
                displayScale,

                18

            );


        ctx.save();


        ctx.translate(

            centerX,

            centerY

        );


        ctx.scale(

            pulse,

            pulse

        );


        ctx.textAlign =
            "center";


        ctx.textBaseline =
            "middle";


        ctx.font =

            `bold ${centerFontSize}px Georgia`;


        /*
        Warna center text
        pakai warna paling terang
        dari palette.
        */

        const centerColor =
            "#BDEDFB";


        /*
        Glow center
        */

        if (
            centerAlpha > 10
        ) {

            ctx.save();


            ctx.scale(
                1.4,
                1.4
            );


            ctx.globalAlpha =

                (
                    centerAlpha / 255
                )

                /
                5;


            ctx.fillStyle =
                "#94D8F4";


            ctx.fillText(

                CENTER_TEXT,

                0,

                0

            );


            ctx.restore();

        }


        /*
        Text center utama
        */

        ctx.globalAlpha =
            centerAlpha
            /
            255;


        ctx.fillStyle =
            centerColor;


        ctx.shadowColor =
            "#94D8F4";


        ctx.shadowBlur =
            14
            *
            displayScale;


        ctx.fillText(

            CENTER_TEXT,

            0,

            0

        );


        ctx.restore();

    }


    /*
    ==========================================================
    BUILD EVERYTHING
    ==========================================================
    */

    function createParticles() {

        /*
        Outline
        */

        outlineParticles =

            buildOutlineParticles(

                160,

                34

            );


        /*
        Fill
        */

        fillParticles =

            buildFillParticles(

                130,

                46

            );


        /*
        Ambil order outline terbesar.
        */

        let outlineSpan = 0;


        for (
            const particle
            of outlineParticles
        ) {

            if (

                particle.order
                >
                outlineSpan

            ) {

                outlineSpan =
                    particle.order;

            }

        }


        /*
        Sama seperti Python:
        */

        const framesPerStep =
            1.6;


        fillStartFrame =

            Math.floor(

                outlineSpan

                *
                framesPerStep

            )

            +
            30;


        /*
        Delay fill random
        */

        for (
            const particle
            of fillParticles
        ) {

            particle.delay =

                fillStartFrame

                +

                particle.order;

        }


        /*
        Delay outline berurutan
        */

        for (
            const particle
            of outlineParticles
        ) {

            particle.delay =

                Math.floor(

                    particle.order

                    *
                    framesPerStep

                );

        }


        /*
        Gabungkan
        */

        particles = [

            ...outlineParticles,

            ...fillParticles

        ];


        /*
        Center text mulai
        saat fill belum 100% selesai.

        Sama seperti Python:
        */

        centerStartFrame =

            fillStartFrame

            +
            200;

    }


    /*
    ==========================================================
    RESIZE
    ==========================================================
    */

    function resizeCanvas() {

        const dpr =

            window.devicePixelRatio

            ||

            1;


        width =
            window.innerWidth;


        height =
            window.innerHeight;


        canvas.width =
            width
            *
            dpr;


        canvas.height =
            height
            *
            dpr;


        canvas.style.width =
            width
            +
            "px";


        canvas.style.height =
            height
            +
            "px";


        ctx.setTransform(

            dpr,

            0,

            0,

            dpr,

            0,

            0

        );


        /*
        Responsive scaling.

        Ratio original tetap dipertahankan.
        */

        displayScale =

            Math.min(

                width
                /
                BASE_WIDTH,

                height
                /
                BASE_HEIGHT

            );


        /*
        Sedikit dibesarkan di layar kecil
        supaya heart tetap kelihatan.
        */

        if (
            width < 700
        ) {

            displayScale *=
                1.6;

        }


        heartScale =

            BASE_SCALE

            *
            displayScale;


        yOffset =

            BASE_Y_OFFSET

            *
            displayScale;


        centerX =
            width / 2;


        centerY =
            height / 2;


        /*
        Reset animasi ketika resize.
        */

        frame = 0;


        createParticles();

    }


    /*
    ==========================================================
    DRAW PARTICLES
    ==========================================================
    */

    function updateAndDrawParticles() {

        for (
            const particle
            of particles
        ) {

            /*
            Fade in.

            Sama seperti:

            p.alpha +=
            14 + random.randint(0, 4)
            */

            if (

                frame
                >
                particle.delay

                &&

                particle.alpha
                <
                255

            ) {

                particle.alpha =

                    Math.min(

                        255,

                        particle.alpha

                        +

                        14

                        +

                        randomInt(
                            0,
                            4
                        )

                    );

            }


            /*
            Setelah alpha penuh,
            baru flicker.
            */

            let flick = 1;


            if (
                particle.alpha
                >=
                255
            ) {

                flick =

                    0.75

                    +

                    0.25

                    *
                    Math.sin(

                        frame
                        *
                        0.04

                        +

                        particle.flicker

                    );

            }


            const alpha =

                Math.floor(

                    particle.alpha

                    *
                    flick

                );


            if (
                alpha <= 0
            ) {

                continue;

            }


            drawGlowText(

                particle,

                alpha

            );

        }

    }


    /*
    ==========================================================
    ANIMATION LOOP
    ==========================================================
    */

    let lastFrameTime = 0;

    const frameDuration =
        1000
        /
        FPS;


    function animate(timestamp) {

        requestAnimationFrame(
            animate
        );


        /*
        Jaga supaya logika mendekati
        60 FPS seperti Pygame.
        */

        if (

            timestamp
            -
            lastFrameTime

            <
            frameDuration
            *
            0.8

        ) {

            return;

        }


        lastFrameTime =
            timestamp;


        frame++;


        /*
        Background flat navy.
        Tidak ada moving gradient.
        */

        ctx.fillStyle =
            BACKGROUND_COLOR;


        ctx.fillRect(

            0,

            0,

            width,

            height

        );


        /*
        Draw semua I Love You
        */

        updateAndDrawParticles();


        /*
        Draw tulisan tengah
        */

        drawCenterText();

    }


    /*
    ==========================================================
    OPTIONAL:
    CLICK UNTUK REPLAY

    Tidak mengubah pattern.
    Hanya mengulang animasi dari awal.
    ==========================================================
    */

    function restartAnimation() {

        frame = 0;

        createParticles();

    }


    canvas.addEventListener(

        "click",

        restartAnimation

    );


    canvas.addEventListener(

        "touchstart",

        function(event) {

            event.preventDefault();

            restartAnimation();

        },

        {
            passive: false
        }

    );


    /*
    ==========================================================
    START
    ==========================================================
    */

    window.addEventListener(

        "resize",

        resizeCanvas

    );


    resizeCanvas();


    requestAnimationFrame(
        animate
    );

</script>

</body>

</html>
